<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../vendor/pdfjs/pdf_viewer.css">
<style>
html,body{margin:0;width:100%;font:14px system-ui,sans-serif;color:#202124;background:#f4f5f7}.top{position:sticky;top:0;z-index:20;background:white;border-bottom:1px solid #ddd;padding:6px}.toolbar{display:none}.toolbar button{margin:3px;padding:7px 10px;border:0;border-radius:6px;background:#e8eefc;cursor:pointer}.status{color:#555;padding:4px 8px}.pages{padding:12px}.page{position:relative;background:white;margin:10px auto;box-shadow:0 1px 7px #0003;overflow:hidden}.page canvas{display:block}.page .textLayer{position:absolute;inset:0;overflow:hidden;pointer-events:auto}.asked-highlight{position:absolute;background:#ffd54f66;border:1px solid #e6ad19;z-index:4;cursor:pointer}.text-document{background:#fff;max-width:850px;min-height:500px;white-space:pre-wrap;padding:30px;margin:12px auto;box-shadow:0 1px 7px #0002}.error{color:#a00;white-space:pre-wrap;padding:10px}
</style></head><body>
<div class="top"><div class="status" id="status"></div><div class="toolbar" id="toolbar"></div></div><div id="error" class="error"></div><div id="pages" class="pages"></div>
<script type="module" src="./reader.js"></script></body></html>
