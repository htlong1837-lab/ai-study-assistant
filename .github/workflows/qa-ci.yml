name: CI

# Chạy cho mọi thay đổi code của cả 4 module (A, B, C, D) và phần khung.
# Bỏ qua thay đổi chỉ ở tài liệu và nhật ký AI.
on:
  push:
    paths-ignore:
      - "docs/**"
      - "ai-log/**"
      - "specs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "ai-log/**"
      - "specs/**"
      - "**/*.md"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt "pytest-cov>=5.0" "ruff>=0.6"
      - name: Lint toàn repo
        run: ruff check .
      - name: Test toàn repo + độ phủ
        run: pytest --cov=modules --cov=core --cov=db --cov-report=term-missing --cov-fail-under=80
      - name: Độ phủ riêng Module A (giữ ngưỡng cũ)
        run: python -m coverage report --include="modules/qa/*" --fail-under=80
