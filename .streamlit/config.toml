# Giao diện sáng, tông san hô nhẹ, bo góc lớn (phong cách app planner).
[theme]
base = "light"
primaryColor = "#F07167"
backgroundColor = "#FFF9F6"
secondaryBackgroundColor = "#FDECE7"
textColor = "#2B2D42"
font = "sans serif"
baseRadius = "large"

[theme.sidebar]
backgroundColor = "#FDECE7"

[browser]
# Không gửi thống kê sử dụng cho Streamlit.
gatherUsageStats = false

[client]
# Giao diện sản phẩm: ẩn nút Deploy và các mục dành cho nhà phát triển.
toolbarMode = "minimal"

[server]
# Bộ theo dõi tệp của Streamlit, khi một tệp đổi, xoá MỌI module nó theo dõi khỏi bộ nhớ, kể cả lúc phiên
# khác đang nạp chúng (trên Streamlit Cloud mỗi lần kéo code mới → app hỏng với KeyError: 'core').
# Không tắt hẳn bộ theo dõi (lớp vỏ Streamlit Cloud cần nó để coi app là đã sẵn sàng), chỉ bỏ các thư
# mục code ra khỏi danh sách theo dõi; các module đó do dp_reload.py tự nạp lại an toàn khi có code mới.
folderWatchBlacklist = ["core", "views", "modules", "db", "data", "tests", ".cache"]
