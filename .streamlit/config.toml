# Giao diện sáng, tông san hô nhẹ, bo góc lớn (phong cách app planner).
[theme]
base = "light"
primaryColor = "#F07167"
backgroundColor = "#FFF9F6"
secondaryBackgroundColor = "#FDECE7"
textColor = "#2B2D42"
font = "sans serif"
baseRadius = "large"

[theme.sidebar]
backgroundColor = "#FDECE7"

[browser]
# Không gửi thống kê sử dụng cho Streamlit.
gatherUsageStats = false

[client]
# Giao diện sản phẩm: ẩn nút Deploy và các mục dành cho nhà phát triển.
toolbarMode = "minimal"

[server]
# Không tự nạp lại code khi tệp thay đổi. Trên Streamlit Cloud, mỗi lần kéo code mới, bộ theo dõi tệp xoá
# các module đang dùng khỏi bộ nhớ trong lúc phiên khác còn nạp chúng → app hỏng (KeyError: 'core').
# Cập nhật code xong thì Reboot app. Khi phát triển trên máy: streamlit run app.py --server.fileWatcherType auto
fileWatcherType = "none"
runOnSave = false
