# Mẫu cấu hình "Đăng nhập bằng Google" cho trang Hộp thư.
# Chép thành .streamlit/secrets.toml (file đó KHÔNG được commit) rồi điền khóa theo docs/dang-nhap-google.md.

[auth]
redirect_uri = "http://localhost:8501/oauth2callback"   # đổi cổng/địa chỉ nếu chạy chỗ khác
cookie_secret = "điền một chuỗi ngẫu nhiên dài"         # python -c "import secrets; print(secrets.token_urlsafe(32))"
expose_tokens = "access"                                 # cho app dùng mã truy cập để đọc Gmail

[auth.google]
client_id = "....apps.googleusercontent.com"
client_secret = "GOCSPX-..."
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
client_kwargs = { scope = "openid email profile https://www.googleapis.com/auth/gmail.readonly", prompt = "consent" }
